<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tepuy Race - Run Beyond Your Limits</title>
    <meta name="description" content="La carrera de trail más épica de Sudamérica. Conquista el Tepuy en la Gran Sabana, Venezuela." />
    <meta name="theme-color" content="#0a4a42" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />

    <!-- Fondo mientras carga JS → evita flash blanco -->
    <style>html,body,#root{background:#0a4a42;margin:0;padding:0}</style>

    <!-- Preconnect → reduce latencia de fuentes -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Fuentes NO bloqueantes: media=print trick -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Inter:wght@400;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Inter:wght@400;600;700&display=swap" />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
